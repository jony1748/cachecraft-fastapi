[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachecraft"
version = "1.0.0"
description = "A resilient, content-addressed payload caching microservice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.6,<1.0"]

[project.scripts]
cache-cli = "cache_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app", "cache_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
